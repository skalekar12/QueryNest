<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueryNest</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a26;
    --border: #2a2a3d;
    --accent: #7c6aff;
    --accent2: #ff6a9d;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --success: #4ade80;
    --error: #f87171;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,106,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Glow orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
    z-index: 0;
  }
  .orb1 {
    width: 500px; height: 500px;
    background: rgba(124,106,255,0.08);
    top: -100px; left: -100px;
  }
  .orb2 {
    width: 400px; height: 400px;
    background: rgba(255,106,157,0.06);
    bottom: -100px; right: -100px;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 24px;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 56px;
    animation: fadeDown 0.6s ease both;
  }

  .logo {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  .brand {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #fff 40%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .tag {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Sections */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
    animation: fadeUp 0.6s ease both;
  }
  .section:nth-child(2) { animation-delay: 0.1s; }
  .section:nth-child(3) { animation-delay: 0.2s; }

  .section-label {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Upload zone */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 40px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent);
    background: rgba(124,106,255,0.05);
  }

  .upload-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .upload-icon {
    font-size: 36px;
    margin-bottom: 12px;
    display: block;
  }

  .upload-text {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }

  .upload-sub {
    font-size: 12px;
    color: var(--muted);
  }

  .file-selected {
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-top: 16px;
    font-size: 13px;
  }

  .file-selected.show { display: flex; }

  .file-icon { color: var(--accent); font-size: 18px; }
  .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-remove {
    cursor: pointer;
    color: var(--muted);
    font-size: 18px;
    transition: color 0.2s;
  }
  .file-remove:hover { color: var(--error); }

  /* Button */
  .btn {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #9b8aff);
    color: #fff;
    width: 100%;
    justify-content: center;
    margin-top: 16px;
  }

  .btn-primary:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(124,106,255,0.35);
  }

  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Status */
  .status {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    margin-top: 14px;
  }
  .status.show { display: flex; }
  .status.success { background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.2); color: var(--success); }
  .status.error { background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.2); color: var(--error); }
  .status.loading { background: rgba(124,106,255,0.08); border: 1px solid rgba(124,106,255,0.2); color: var(--accent); }

  /* Spinner */
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }

  /* Chat */
  .chat-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    height: 320px;
    overflow-y: auto;
    padding: 16px;
    margin-bottom: 16px;
    scroll-behavior: smooth;
  }

  .chat-box::-webkit-scrollbar { width: 4px; }
  .chat-box::-webkit-scrollbar-track { background: transparent; }
  .chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .chat-empty {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13px;
    gap: 8px;
  }

  .chat-empty-icon { font-size: 32px; opacity: 0.4; }

  .message {
    margin-bottom: 16px;
    animation: fadeUp 0.3s ease both;
  }

  .message-role {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .message.user .message-role { color: var(--accent2); }
  .message.assistant .message-role { color: var(--accent); }

  .message-content {
    font-size: 14px;
    line-height: 1.7;
    padding: 12px 16px;
    border-radius: 10px;
    max-width: 85%;
  }

  .message.user .message-content {
    background: rgba(255,106,157,0.08);
    border: 1px solid rgba(255,106,157,0.15);
    margin-left: auto;
    text-align: right;
  }

  .message.assistant .message-content {
    background: rgba(124,106,255,0.08);
    border: 1px solid rgba(124,106,255,0.15);
  }

  /* Input row */
  .input-row {
    display: flex;
    gap: 10px;
  }

  .question-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .question-input:focus { border-color: var(--accent); }
  .question-input::placeholder { color: var(--muted); }

  .btn-ask {
    background: linear-gradient(135deg, var(--accent2), #ff8db8);
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 18px;
    transition: all 0.2s;
    display: flex; align-items: center;
  }

  .btn-ask:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(255,106,157,0.35);
  }

  .btn-ask:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Thinking dots */
  .thinking span {
    display: inline-block;
    animation: blink 1.2s infinite;
  }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="container">

  <header>
    <div class="logo">🪺</div>
    <div class="brand">QueryNest</div>
    <div class="tag">RAG · v1.0</div>
  </header>

  <!-- Upload Section -->
  <div class="section">
    <div class="section-label">01 — Upload Document</div>

    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept=".pdf" />
      <span class="upload-icon">📄</span>
      <div class="upload-text">Drop your PDF here</div>
      <div class="upload-sub">or click to browse — PDF only</div>
    </div>

    <div class="file-selected" id="fileSelected">
      <span class="file-icon">📎</span>
      <span class="file-name" id="fileName"></span>
      <span class="file-remove" id="fileRemove">✕</span>
    </div>

    <button class="btn btn-primary" id="uploadBtn" disabled>
      <span>Process Document</span>
    </button>

    <div class="status" id="uploadStatus"></div>
  </div>

  <!-- Ask Section -->
  <div class="section">
    <div class="section-label">02 — Ask Questions</div>

    <div class="chat-box" id="chatBox">
      <div class="chat-empty" id="chatEmpty">
        <span class="chat-empty-icon">💬</span>
        <span>Upload a document to start asking questions</span>
      </div>
    </div>

    <div class="input-row">
      <input
        type="text"
        class="question-input"
        id="questionInput"
        placeholder="Ask anything about the document..."
        disabled
      />
      <button class="btn-ask" id="askBtn" disabled>➤</button>
    </div>
  </div>

</div>

<script>
  const API = '/api';

  const fileInput = document.getElementById('fileInput');
  const uploadZone = document.getElementById('uploadZone');
  const fileSelected = document.getElementById('fileSelected');
  const fileName = document.getElementById('fileName');
  const fileRemove = document.getElementById('fileRemove');
  const uploadBtn = document.getElementById('uploadBtn');
  const uploadStatus = document.getElementById('uploadStatus');
  const chatBox = document.getElementById('chatBox');
  const chatEmpty = document.getElementById('chatEmpty');
  const questionInput = document.getElementById('questionInput');
  const askBtn = document.getElementById('askBtn');

  let selectedFile = null;
  let indexReady = false;

  // Drag and drop
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type === 'application/pdf') setFile(file);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) setFile(fileInput.files[0]);
  });

  function setFile(file) {
    selectedFile = file;
    fileName.textContent = file.name;
    fileSelected.classList.add('show');
    uploadBtn.disabled = false;
    hideStatus();
  }

  fileRemove.addEventListener('click', () => {
    selectedFile = null;
    fileInput.value = '';
    fileSelected.classList.remove('show');
    uploadBtn.disabled = true;
    hideStatus();
  });

  uploadBtn.addEventListener('click', async () => {
    if (!selectedFile) return;

    showStatus('loading', '⏳ Processing document...');
    uploadBtn.disabled = true;

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      const res = await fetch(`${API}/upload`, { method: 'POST', body: formData });
      const data = await res.json();

      if (res.ok) {
        showStatus('success', `✓ Ready — ${data.num_chunks} chunks from ${data.num_pages} pages`);
        enableChat();
      } else {
        showStatus('error', `✗ ${data.error || data.detail || 'Upload failed'}`);
        uploadBtn.disabled = false;
      }
    } catch (err) {
      showStatus('error', `✗ Could not reach server. Is it running?`);
      uploadBtn.disabled = false;
    }
  });

  function enableChat() {
    indexReady = true;
    questionInput.disabled = false;
    askBtn.disabled = false;
    questionInput.placeholder = 'Ask anything about the document...';
    chatEmpty.style.display = 'none';
    questionInput.focus();
  }

  function showStatus(type, msg) {
    uploadStatus.className = `status ${type} show`;
    uploadStatus.innerHTML = type === 'loading'
      ? `<div class="spinner"></div><span>${msg}</span>`
      : `<span>${msg}</span>`;
  }

  function hideStatus() {
    uploadStatus.className = 'status';
  }

  // Chat
  questionInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !askBtn.disabled) askBtn.click();
  });

  askBtn.addEventListener('click', async () => {
    const q = questionInput.value.trim();
    if (!q || !indexReady) return;

    addMessage('user', q);
    questionInput.value = '';
    askBtn.disabled = true;
    questionInput.disabled = true;

    const thinkingId = addThinking();

    try {
      const res = await fetch(`${API}/ask`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q })
      });
      const data = await res.json();
      removeThinking(thinkingId);

      if (res.ok) {
        let content = data.answer;

if (data.sources && data.sources.length > 0) {
  content += "\n\n---\nSources:\n";

  data.sources.forEach((src, i) => {
    content += `\n[${i+1}] ${src.slice(0, 120)}...`;
  });
}

addMessage('assistant', content);
      } else {
        addMessage('assistant', `Error: ${data.error || data.detail || 'Something went wrong'}`);
      }
    } catch (err) {
      removeThinking(thinkingId);
      addMessage('assistant', '✗ Could not reach server.');
    }

    askBtn.disabled = false;
    questionInput.disabled = false;
    questionInput.focus();
  });

  function addMessage(role, content) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = `
      <div class="message-role">${role === 'user' ? 'You' : 'QueryNest'}</div>
      <div class="message-content">${escapeHtml(content)}</div>
    `;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
  }

  function addThinking() {
    const id = 'thinking-' + Date.now();
    const div = document.createElement('div');
    div.className = 'message assistant';
    div.id = id;
    div.innerHTML = `
      <div class="message-role">QueryNest</div>
      <div class="message-content thinking">
        <span>●</span><span>●</span><span>●</span>
      </div>
    `;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return id;
  }

  function removeThinking(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\n/g, '<br>');
  }
</script>
</body>
</html>
